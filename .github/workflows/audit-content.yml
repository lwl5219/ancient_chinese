name: audit-content

on:
  pull_request:
  push:
    branches: [master]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Guwen Guanzhi fields
        run: python3 scripts/audit_content.py
      - name: Install OpenCC for the source check
        run: python3 -m pip install opencc-python-reimplemented
      - name: Diff texts against cached sources
        run: python3 scripts/verify_sources.py
