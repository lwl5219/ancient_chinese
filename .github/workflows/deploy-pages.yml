name: Deploy audited artifact to Pages

on:
  workflow_call:
    inputs:
      artifact-id:
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Publish Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          path: site
          merge-multiple: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public Pages bytes against the audited artifact
        run: python3 scripts/verify_live.py site https://maruiduan.github.io/ancient_chinese/
