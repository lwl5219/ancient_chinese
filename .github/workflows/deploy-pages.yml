name: Deploy to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  # Pages is published from the master branch itself. Stamp that branch so
  # github.io serves the hashed names. The follow-up commit is marked so it
  # does not stamp again.
  commit:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip stamp]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp public files on master
        run: |
          set -euo pipefail
          rm -rf /tmp/site-stamp
          mkdir -p /tmp/site-stamp
          cp index.html favicon.svg .nojekyll /tmp/site-stamp/
          cp -a css js data audio /tmp/site-stamp/
          python3 scripts/stamp_assets.py /tmp/site-stamp
          rm -rf css js data
          cp -a /tmp/site-stamp/css /tmp/site-stamp/js /tmp/site-stamp/data .
          cp /tmp/site-stamp/index.html /tmp/site-stamp/version.json .
          cp /tmp/site-stamp/favicon.*.svg .
          git add -A index.html version.json favicon.svg favicon.*.svg css js data
          if git diff --cached --quiet; then
            echo "Public files already match the content hashes."
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "Stamp content hashes for GitHub Pages [skip stamp]"
          git push

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage and stamp content hashes
        run: |
          rm -rf site
          mkdir -p site
          cp index.html favicon.svg .nojekyll site/
          cp -a css js data audio site/
          python3 scripts/stamp_assets.py site
          test -f site/version.json
          grep -q 'css/app\.[0-9a-f]\{12\}\.css' site/index.html
          grep -q 'js/app\.[0-9a-f]\{12\}\.js' site/index.html
          grep -q 'data-build="[0-9a-f]\{12\}"' site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
