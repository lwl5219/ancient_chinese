<!DOCTYPE html>
<html lang="zh-CN" data-build="bfc67c8b8be2">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>典籍</title>
  <meta name="description" content="按原书读经典。古文观止、资治通鉴、人间词话、唐诗、宋词。点开字，看读音和本义。" />
  <link rel="stylesheet" href="css/app.d9e97eabe02d.css" />
  <link rel="icon" href="favicon.d1fff3b26c56.svg" type="image/svg+xml" />
  <script src="js/asset-urls.7496f78bf8c1.js"></script>
  <script>
    (function () {
      var build = document.documentElement.getAttribute("data-build") || window.SITE_BUILD || "";
      function check() {
        if (!build) return;
        fetch("version.json", { cache: "no-store" }).then(function (res) {
          if (!res.ok) return null;
          return res.json();
        }).then(function (data) {
          if (!data || !data.build || data.build === build) return;
          try {
            if (sessionStorage.getItem("gwgz-build-reload") === data.build) return;
            sessionStorage.setItem("gwgz-build-reload", data.build);
          } catch (err) {}
          location.reload();
        }).catch(function () {});
      }
      check();
      window.addEventListener("focus", check);
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") check();
      });
    })();
  </script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#/">典籍</a>
    <nav class="crumb" id="crumb" aria-label="当前位置"></nav>
    <div class="read-tools" id="read-tools" hidden>
      <button type="button" class="tool-py" id="tool-py" aria-pressed="true">拼音</button>
      <div class="tool-seg" role="group" aria-label="阅读方式">
        <button type="button" data-mode="full">全文</button>
        <button type="button" data-mode="sentence">逐句</button>
      </div>
    </div>
    <p class="top-progress" id="top-progress" aria-live="polite"></p>
    <div class="top-meter" aria-hidden="true"><i id="top-meter-fill"></i></div>
  </header>
  <div class="shell">

    <main class="main" id="main"></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="典籍">
    <a href="#/" data-tab="home">典籍</a>
    <a href="#/gwgz" data-tab="gwgz">观止</a>

  <nav class="dock" id="dock" hidden aria-label="翻篇">
